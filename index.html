<title>DL &amp; GenAI — Quiz 2 Trainer</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#101C29;
  --ink2:#43596E;
  --ink3:#7C8FA0;
  --paper:#FFFFFF;
  --ground:#E7ECEF;
  --rule:#CFD9E0;
  --teal:#1B6B62;
  --teal-soft:#E4F0EE;
  --ochre:#A8700F;
  --ochre-soft:#FBF0DC;
  --crimson:#AF382D;
  --crimson-soft:#FAE7E4;
  --indigo:#3A3B72;
  --indigo-soft:#ECEDF7;
  --shadow:0 1px 2px rgba(16,28,41,.06),0 8px 24px rgba(16,28,41,.06);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --disp:"Space Grotesk","IBM Plex Sans",-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;align-items:flex-start}

/* ---------- sidebar ---------- */
.rail{
  width:288px;flex:0 0 288px;
  position:sticky;top:0;height:100vh;
  background:var(--ink);
  color:#DCE5EC;
  display:flex;flex-direction:column;
  overflow:hidden;
}
.rail-head{padding:26px 24px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.rail-eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:#7FA8A2;margin:0 0 8px;
}
.rail-title{
  font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.15;
  letter-spacing:-.015em;color:#fff;margin:0;
}
.rail-sub{font-size:12.5px;color:#8FA3B4;margin:6px 0 0;line-height:1.45}

/* target meter — signature element */
.meter{padding:18px 24px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.meter-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8FA3B4}
.meter-pct{font-family:var(--disp);font-weight:700;font-size:22px;color:#fff;letter-spacing:-.02em}
.meter-track{position:relative;height:9px;background:rgba(255,255,255,.11);border-radius:0}
.meter-fill{height:100%;background:#3FA394;width:0%;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.meter-fill.hit{background:#6FD9C4}
.meter-mark{position:absolute;top:-5px;bottom:-5px;left:95%;width:2px;background:#E8B54B}
.meter-mark::after{
  content:"95";position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9.5px;color:#E8B54B;letter-spacing:.05em;
}
.meter-note{font-family:var(--mono);font-size:10.5px;color:#7C93A6;margin-top:12px;letter-spacing:.02em}

.rail-nav{flex:1;overflow-y:auto;padding:10px 0 24px}
.navitem{
  display:flex;align-items:center;gap:11px;width:100%;
  background:none;border:0;text-align:left;cursor:pointer;
  padding:9px 24px;color:#B6C6D3;font-family:var(--sans);font-size:14px;
  border-left:3px solid transparent;transition:background .12s,color .12s;
}
.navitem:hover{background:rgba(255,255,255,.055);color:#fff}
.navitem.on{background:rgba(63,163,148,.15);border-left-color:#3FA394;color:#fff;font-weight:600}
.navitem:focus-visible{outline:2px solid #6FD9C4;outline-offset:-2px}
.navnum{font-family:var(--mono);font-size:10.5px;color:#6D8494;min-width:16px}
.navitem.on .navnum{color:#6FD9C4}
.navname{flex:1;line-height:1.3}
.navdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16);flex:0 0 7px}
.navdot.part{background:#E8B54B}
.navdot.done{background:#3FA394}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:34px 40px 90px;max-width:900px}
.topichead{margin-bottom:26px}
.crumb{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--teal);margin:0 0 9px;
}
.topichead h1{
  font-family:var(--disp);font-weight:700;font-size:35px;line-height:1.08;
  letter-spacing:-.025em;margin:0 0 10px;
}
.topichead .lede{font-size:16.5px;color:var(--ink2);margin:0;max-width:64ch}

.card{
  background:var(--paper);border:1px solid var(--rule);
  padding:24px 26px;margin-bottom:16px;box-shadow:var(--shadow);
}
.card > h2{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 15px;font-weight:600;
}
.card p{margin:0 0 12px}
.card p:last-child{margin-bottom:0}
.card ul{margin:0 0 12px;padding-left:20px}
.card li{margin-bottom:7px}
.card li:last-child{margin-bottom:0}
strong{font-weight:600;color:var(--ink)}
code{
  font-family:var(--mono);font-size:.875em;background:#EDF1F4;
  padding:1.5px 5px;border:1px solid #DEE5EA;color:#243B4F;
}

/* formula block */
.fx{
  background:var(--indigo-soft);border:1px solid #D5D7EB;border-left:3px solid var(--indigo);
  padding:17px 20px;margin:0 0 12px;overflow-x:auto;
}
.fx:last-child{margin-bottom:0}
.fx-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--indigo);margin:0 0 9px;font-weight:600;
}
.fx-math{font-size:17px;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.fx-note{font-size:13.5px;color:var(--ink2);margin:10px 0 0;line-height:1.5}

/* worked example */
.worked{background:var(--teal-soft);border:1px solid #C4DED9;border-left:3px solid var(--teal)}
.worked > h2{color:var(--teal)}
.step{display:flex;gap:13px;margin-bottom:13px}
.step:last-child{margin-bottom:0}
.stepn{
  font-family:var(--mono);font-size:10.5px;font-weight:600;color:#fff;background:var(--teal);
  width:20px;height:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;
  margin-top:3px;
}
.stepbody{flex:1;min-width:0}
.stepbody p{margin:0 0 7px;font-size:15px}
.stepbody p:last-child{margin-bottom:0}
.stepmath{font-size:15.5px;overflow-x:auto;padding:5px 0}
.result{
  font-family:var(--mono);font-weight:600;font-size:15px;color:var(--teal);
  background:#fff;border:1px solid #C4DED9;padding:8px 12px;display:inline-block;margin-top:5px;
}

/* traps */
.traps{background:var(--ochre-soft);border:1px solid #ECDCB8;border-left:3px solid var(--ochre)}
.traps > h2{color:var(--ochre)}
.traps ul{list-style:none;padding:0;margin:0}
.traps li{
  padding-left:24px;position:relative;margin-bottom:11px;font-size:15px;line-height:1.55;
}
.traps li:last-child{margin-bottom:0}
.traps li::before{
  content:"!";position:absolute;left:0;top:1px;
  font-family:var(--mono);font-weight:700;font-size:11px;color:#fff;background:var(--ochre);
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;
}

/* code sample */
pre{
  font-family:var(--mono);font-size:13px;line-height:1.65;background:#F4F7F9;
  border:1px solid var(--rule);padding:14px 16px;overflow-x:auto;margin:0 0 12px;
  color:#22384B;
}
pre:last-child{margin-bottom:0}

/* ---------- practice ---------- */
.drillhead{
  display:flex;justify-content:space-between;align-items:baseline;
  margin:34px 0 15px;padding-bottom:11px;border-bottom:2px solid var(--ink);
}
.drillhead h2{
  font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:0;
}
.drillscore{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}

.q{
  background:var(--paper);border:1px solid var(--rule);
  padding:21px 24px;margin-bottom:14px;box-shadow:var(--shadow);
}
.q-top{display:flex;gap:11px;align-items:baseline;margin-bottom:13px}
.q-n{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  color:var(--ink3);flex:0 0 auto;padding-top:2px;
}
.q-stem{flex:1;min-width:0;font-size:16px;line-height:1.6}
.q-stem p{margin:0 0 10px}
.q-stem p:last-child{margin-bottom:0}
.q-stem .stemmath{padding:6px 0;overflow-x:auto}

.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:13px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:#FBFCFD;border:1px solid var(--rule);padding:11px 14px;
  cursor:pointer;font-family:var(--sans);font-size:15.2px;line-height:1.5;color:var(--ink);
  transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:var(--ink3);background:#fff}
.opt:disabled{cursor:default}
.opt:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.opt-k{
  font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink3);
  flex:0 0 auto;padding-top:2px;
}
.opt-t{flex:1;min-width:0}
.opt.sel{border-color:var(--indigo);background:var(--indigo-soft)}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.right .opt-k{color:var(--teal)}
.opt.wrong{border-color:var(--crimson);background:var(--crimson-soft)}
.opt.wrong .opt-k{color:var(--crimson)}

.numrow{display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
.numin{
  font-family:var(--mono);font-size:15.5px;padding:10px 13px;
  border:1px solid var(--rule);background:#FBFCFD;width:170px;color:var(--ink);
}
.numin:focus{outline:2px solid var(--teal);outline-offset:-1px;background:#fff}
.numin:disabled{background:#EFF3F5;color:var(--ink2)}
.numunit{font-family:var(--mono);font-size:12.5px;color:var(--ink3)}

.btn{
  font-family:var(--sans);font-size:14px;font-weight:600;padding:10px 19px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
  transition:opacity .12s;
}
.btn:hover{opacity:.85}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

.verdict{padding:14px 16px;font-size:15px;line-height:1.6;border-left:3px solid;margin-top:4px}
.verdict.ok{background:var(--teal-soft);border-color:var(--teal)}
.verdict.no{background:var(--crimson-soft);border-color:var(--crimson)}
.verdict-tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;display:block;margin-bottom:7px;
}
.verdict.ok .verdict-tag{color:var(--teal)}
.verdict.no .verdict-tag{color:var(--crimson)}
.verdict p{margin:0 0 9px}
.verdict p:last-child{margin-bottom:0}
.verdict .vmath{padding:5px 0;overflow-x:auto}

/* footer nav */
.pagenav{display:flex;justify-content:space-between;gap:12px;margin-top:38px}
.pagebtn{
  font-family:var(--sans);font-size:14px;font-weight:600;padding:13px 20px;
  border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;
  box-shadow:var(--shadow);
}
.pagebtn:hover{border-color:var(--ink)}
.pagebtn:disabled{opacity:.35;cursor:default}
.pagebtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* mobile */
.mobbar{display:none}
@media(max-width:880px){
  .shell{flex-direction:column}
  .rail{
    position:static;width:100%;flex:none;height:auto;
  }
  .rail-nav{display:none}
  .mobbar{
    display:flex;gap:7px;overflow-x:auto;padding:13px 16px;
    background:var(--ink);border-top:1px solid rgba(255,255,255,.1);
    -webkit-overflow-scrolling:touch;
  }
  .mobbar::-webkit-scrollbar{display:none}
  .mobchip{
    flex:0 0 auto;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
    color:#C3D2DD;font-family:var(--mono);font-size:11.5px;padding:7px 13px;cursor:pointer;
    white-space:nowrap;
  }
  .mobchip.on{background:#3FA394;border-color:#3FA394;color:#062420;font-weight:600}
  .main{padding:24px 18px 70px;max-width:none}
  .topichead h1{font-size:27px}
  .card{padding:19px 17px}
  .q{padding:18px 17px}
  .fx-math{font-size:15.5px}
  .numin{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
